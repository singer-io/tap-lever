version: 2.1
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-lever
            source /usr/local/share/virtualenvs/tap-lever/bin/activate
            uv pip install -U 'pip==22.2.2' 'setuptools==65.3.0'
            uv pip install .[dev]
      - add_ssh_keys
      - run:
          name: 'JSON Validator'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json tap_lever/schemas/*.json
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-lever/bin/activate
            uv pip install pytest coverage pylint
            coverage run -m pytest tests
            coverage html
      - run:
          name: 'Pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-lever/bin/activate
            pylint tap_lever/ -d C,R,W
